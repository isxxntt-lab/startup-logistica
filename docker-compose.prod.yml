# Stack de producción. Postgres y Redis NO se publican al host.
# Uso:
#   cp .env.production.example .env.production
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Smoke local con HTTPS interno (localhost / api.localhost, sin ACME público):
#   cp .env.production.local.example .env.production
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.local.yml \
#     --env-file .env.production up -d --build
#   ver deploy/LOCAL_HTTPS.md
#
# Redes:
#   edge     — Caddy (80/443) y backends que proxifica (web, api)
#   internal — PostGIS, Redis, workers; la API también está aquí para llegar a datos
# Caddy no se une a internal: un compromiso del proxy no da L3 a PostGIS/Redis.
#
# No monta infra/postgres/02-seed.sql (datos demo).

name: startup-logistica-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_TRACKING: ${SITE_TRACKING:-seguimiento.rutacerca.es}
      SITE_API: ${SITE_API:-api.rutacerca.es}
      ACME_EMAIL: ${ACME_EMAIL:-ops@rutacerca.es}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - edge

  web:
    build:
      context: .
      dockerfile: apps/web-cliente/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    expose:
      - "8080"
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=1777
      - /var/run:uid=101,gid=101,mode=1777
      - /var/log/nginx:uid=101,gid=101,mode=1777
      - /var/lib/nginx:uid=101,gid=101,mode=1777
      - /tmp:uid=101,gid=101,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks:
      - edge

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      TMPDIR: /tmp
      HOME: /tmp
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_MASTER_SECRET: ${JWT_MASTER_SECRET}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      OPS_TOKEN: ${OPS_TOKEN:-}
      OPS_CHECKS_INTERVAL_MS: ${OPS_CHECKS_INTERVAL_MS:-120000}
      OPS_CLIENT_RESPONSE_DELAY_MINUTES: ${OPS_CLIENT_RESPONSE_DELAY_MINUTES:-20}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
    tmpfs:
      - /tmp:mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/ops/health').then(r=>process.exit(r.ok?0:1)).catch(()=>fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1)))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - edge
      - internal

  workers:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TMPDIR: /tmp
      HOME: /tmp
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_MASTER_SECRET: ${JWT_MASTER_SECRET}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
    tmpfs:
      - /tmp:mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--input-type=module",
          "-e",
          "const redisUrl=process.env.REDIS_URL;const dbUrl=process.env.DATABASE_URL;if(!redisUrl||!dbUrl)process.exit(1);const [{default:Redis},pgMod]=await Promise.all([import('ioredis'),import('pg')]);const Pg=pgMod.default??pgMod;const r=new Redis(redisUrl,{connectTimeout:3000,maxRetriesPerRequest:1,lazyConnect:true});const c=new Pg.Client({connectionString:dbUrl,connectionTimeoutMillis:3000});try{await r.connect();const pong=await r.ping();await c.connect();await c.query('SELECT 1');await r.quit();await c.end();process.exit(pong==='PONG'?0:1)}catch{try{r.disconnect()}catch{}try{await c.end()}catch{}process.exit(1)}",
        ]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 25s
    networks:
      - internal

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rutacerca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-startup_logistica}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./infra/postgres/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./infra/postgres/03-analytics.sql:/docker-entrypoint-initdb.d/03-analytics.sql:ro
      - ./infra/postgres/04-ops.sql:/docker-entrypoint-initdb.d/04-ops.sql:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-rutacerca} -d ${POSTGRES_DB:-startup_logistica}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    volumes:
      - redisdata_prod:/data
    tmpfs:
      - /tmp:mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

volumes:
  pgdata_prod:
  redisdata_prod:
  caddy_data:
  caddy_config:

networks:
  edge:
  internal:
