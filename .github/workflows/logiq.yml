# CI del stack LogiQ (npm, independiente del workspace pnpm de apps/*).
# Contabo prod no se toca. Secretos solo desde GitHub Actions (nunca en git ni logs).
name: LogiQ CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "logiq/**"
      - ".github/workflows/logiq.yml"
  pull_request:
    branches: [main]
    paths:
      - "logiq/**"
      - ".github/workflows/logiq.yml"

concurrency:
  group: logiq-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  unit:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            logiq/packages/shared/package-lock.json
            logiq/services/service-orders/package-lock.json
            logiq/services/service-fleet/package-lock.json
            logiq/services/service-routing/package-lock.json

      - name: Shared tests + typecheck de servicios
        working-directory: logiq
        run: ./scripts/ci-unit.sh

  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - service-orders
          - service-fleet
          - service-routing
    steps:
      - uses: actions/checkout@v4

      - name: Build image (sin push)
        working-directory: logiq
        run: >
          docker build
          -f "services/${{ matrix.service }}/Dockerfile"
          -t "logiq-${{ matrix.service }}:ci"
          .

  smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit, docker-build]
    defaults:
      run:
        working-directory: logiq
        shell: bash
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      GATEWAY_PORT: "8080"
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar secretos de repo (sin imprimir valores)
        run: |
          set +x
          if [ -z "${INTERNAL_SERVICE_TOKEN}" ] || [ -z "${REDIS_PASSWORD}" ]; then
            echo "Faltan secretos de Actions: INTERNAL_SERVICE_TOKEN y REDIS_PASSWORD." >&2
            echo "Blue: GitHub → Settings → Secrets and variables → Actions. Guía en logiq/README.md (CI)." >&2
            echo "Usa valores solo de CI; no reutilices el token de Contabo prod." >&2
            exit 1
          fi
          echo "ok: secretos presentes (enmascarados por Actions)"

      - name: Escribir .env de runner (gitignored, no se sube como artifact)
        run: |
          set +x
          ./scripts/ci-write-env.sh

      - name: Compose up (Redis interno, sin puertos de DB al host)
        run: |
          set +x
          docker compose up -d --build --wait --wait-timeout 180

      - name: Redis/Postgres no publican puertos al host
        run: ./scripts/ci-assert-no-db-host-ports.sh

      - name: Smoke (health 200, POST anónimo 401, Bearer Contabo 201)
        run: |
          set +x
          BASE=http://127.0.0.1:8080 ./scripts/smoke.sh

      - name: Estado de compose si falla (sin Redis logs ni .env)
        if: failure()
        run: |
          set +x
          docker compose ps --format 'table {{.Service}}\t{{.Status}}\t{{.Ports}}'
          docker compose logs --no-color --tail=80 gateway service-orders service-fleet service-routing \
            | sed -E 's/(Bearer )[^[:space:]]+/\1***/Ig; s#(redis://:)[^@]+@#\1***@#g; s/(INTERNAL_SERVICE_TOKEN=)[^[:space:]]+/\1***/g; s/(REDIS_PASSWORD=)[^[:space:]]+/\1***/g; s/(REDISCLI_AUTH=)[^[:space:]]+/\1***/g'

      - name: Compose down (sin artifacts)
        if: always()
        run: |
          set +x
          docker compose down -v --remove-orphans
          rm -f .env
