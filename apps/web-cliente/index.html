<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tu entrega</title>
  </head>
  <body>
    <div id="app">
      <header>
        <p class="eyebrow">Entrega de hoy</p>
        <h1 id="titulo">Cargando…</h1>
        <p id="estado" class="pill">—</p>
      </header>
      <div id="mapa"></div>
      <section id="acciones" hidden>
        <button data-accion="confirmado">Confirmar que estaré</button>
        <button data-accion="ausente" class="ghost">No voy a estar</button>
        <button data-accion="reprogramado" class="ghost">Reprogramar</button>
        <button id="btn-puntos" class="ghost">Punto de recogida cercano</button>
      </section>
      <ul id="puntos"></ul>
      <p id="error" class="error"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
