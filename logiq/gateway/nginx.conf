worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/json;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 1m;
  server_tokens off;

  log_format main '$remote_addr $request $status $body_bytes_sent';
  access_log /var/log/nginx/access.log main;

  upstream orders {
    server service-orders:3000;
  }

  upstream fleet {
    server service-fleet:3001;
  }

  upstream routing {
    server service-routing:3002;
  }

  server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location = /health {
      default_type application/json;
      add_header Cache-Control "no-store";
      return 200 '{"ok":true,"service":"gateway"}\n';
    }

    # Convención Contabo: /{servicio}/health → backend GET /health (sin auth).
    location = /orders/health {
      proxy_pass http://orders/health;
    }

    location = /fleet/health {
      proxy_pass http://fleet/health;
    }

    location = /routing/health {
      proxy_pass http://routing/health;
    }

    location /orders {
      proxy_pass http://orders;
    }

    location /fleet {
      proxy_pass http://fleet;
    }

    location /routing {
      proxy_pass http://routing;
    }
  }
}
